# FroodzOS record-everything switch: this file is intentionally inert.
#
# sysctl.d has no per-boot condition, so active values here would raise kernel console
# verbosity on every public-image boot. The runtime values below are applied by
# fz-record-kernel.service (ConditionKernelCommandLine=fz_record=full) instead:
#     kernel.printk = 8 4 1 7
#     kernel.printk_devkmsg = on
#
# What sysctl can do at runtime is limited to the console level and the /dev/kmsg writer
# ratelimit. These cannot be changed at runtime and belong on the GRUB/kernel command line
# only when the entry wants them: log_buf_len (ring size, allocated at boot), printk.time
# (compiled default), earlycon/efi=debug, rd.log=, ignore_loglevel, systemd.log_*,
# udev.log_level, trace_buf_size, panic=*, pstore.backend= and ramoops memory.
# See docs/smartlog/KERNEL-CMDLINE.md.
