# FroodzOS 0.1.0-dev.9: closing the lid or idling must not try to suspend (see sleep.conf.d/90-froodzos-nosuspend.conf).
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
IdleAction=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
