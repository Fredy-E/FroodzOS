# FroodzOS: bound systemd-coredump on the live image. /var is the RAM-backed overlay here;
# the default ProcessSizeMax/ExternalSizeMax of 32G can freeze the desktop and fill memory.
# Storage=none still processes cores (journal + backtrace) but keeps no core file, so the
# crash evidence reaches the journal and stream 'ui' without retaining process memory.
[Coredump]
Storage=none
Compress=yes
ProcessSizeMax=512M
MaxUse=256M
KeepFree=1G
