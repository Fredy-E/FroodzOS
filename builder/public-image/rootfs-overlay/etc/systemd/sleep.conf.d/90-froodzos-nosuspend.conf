# FroodzOS 0.1.0-dev.9: suspend and hibernate are switched off. On the Lenovo 83N3 the Wi-Fi chip (ath12k) fails to come back after
# resume ("failed to resume core: -110", seen in an owner boot after a Plasma idle suspend), and suspend is not a supported feature yet.
# Remove this file when resume works.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
