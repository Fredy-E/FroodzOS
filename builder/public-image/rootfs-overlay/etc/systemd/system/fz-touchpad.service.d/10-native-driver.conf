# The user-space touchpad driver is only the fallback: when the kernel binds the pad (i2c_hid_of, device tree with the interrupt) it must stay out
# of the way. ExecCondition exit status 1 skips the unit quietly (no failure, no restart loop).
[Service]
ExecCondition=/bin/sh -c '[ ! -e /sys/bus/i2c/devices/0-0038/driver ]'
