# FroodzOS record-everything switch: this file is intentionally inert.
#
# journald reads every *.conf in this directory unconditionally, and a drop-in cannot test the
# kernel command line. Active settings here would therefore change every public-image boot.
# The W1 section 6 policy (RateLimit off, MaxLevelStore=debug, MaxLevelKMsg=debug,
# ForwardToKMsg=yes, volatile size caps) is written by fz-record-journald.service to
#     /run/systemd/journald.conf.d/95-froodzos-record.conf
# and journald is restarted, only when /proc/cmdline contains the whole word
#     fz_record=full
# Run `fz-record-journald --print` on the stick to see the exact runtime drop-in.
# Do not copy those settings into this file unless the image itself is meant to be a debug image.
