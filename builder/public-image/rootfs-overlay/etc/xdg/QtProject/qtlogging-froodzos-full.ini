# FroodzOS curated Qt/KDE logging rules for a full recording boot (fz_record=full).
#
# This file is NOT read by Qt under this name. fz-ui-capture enable-qt links it to
# /etc/xdg/QtProject/qtlogging.ini before SDDM starts, and the plasma-workspace environment
# snippet exports QT_LOGGING_CONF for the user session. Without fz_record=full nothing is
# linked, so the stock image keeps all categorized debug output off.
#
# Rules are evaluated in text order; the last matching rule wins. The first line keeps every
# category quiet, then only the curated UI categories are switched on. qt.scenegraph.*,
# qt.quick.* and a global *.debug=true are deliberately absent: on llvmpipe they can turn the
# desktop into a slideshow and fill the journal in minutes.
[Rules]
*.debug=false
default.debug=true

# KWin (categories confirmed in kwin 6.8.3 sources)
kwin_core.debug=true
kwin_wayland_backend.debug=true
kwin_wayland_drm.debug=true
kwin_libinput.debug=true
kwin_scripting.debug=true
kwin_decorations.debug=true
kwin_tabbox.debug=true
kwin_scene_opengl.debug=true

# Qt platform: window, screen, seat and portal registration
qt.qpa.*.debug=true

# KDE Frameworks most relevant to the desktop
kf.kio.*.debug=true
kf.solid.*.debug=true
kf.notifications.debug=true
kf.kded.debug=true

# Plasma, PowerDevil and the KDE portal backend
org.kde.plasma*.debug=true
plasmashell.debug=true
org.kde.powerdevil.debug=true
xdp-kde-*.debug=true
