# FroodzOS: Lenovo IdeaPad Slim 3 15Q8X10 (83N3, Snapdragon X1-26-100): 2x WSA884x speakers, digital microphones, WCD9385 headset.
# Needs the Romulus topology (X1E80100-Romulus-tplg.bin, the one the ThinkPad T14s class uses) and a device tree built with
# fz-dtb-fixup.py --sound-nodp (no DisplayPort dai-links), so there are no HDMI/DisplayPort devices here.

SectionUseCase."HiFi" {
	File "/Qualcomm/x1e80100/Ideapad-3-HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	cset "name='HPHL Volume' 20"
	cset "name='HPHR Volume' 20"
	cset "name='ADC2 Volume' 10"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd938x/init.conf"
Include.wsa-init.File "/codecs/wsa884x/two-speakers/init.conf"
Include.wsam-init.File "/codecs/qcom-lpass/wsa-macro/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"
