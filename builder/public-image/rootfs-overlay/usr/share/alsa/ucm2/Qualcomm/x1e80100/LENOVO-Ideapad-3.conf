# FroodzOS: Lenovo IdeaPad Slim 3 15Q8X10 (83N3, Snapdragon X1-26-100): 2x WSA884x speakers, digital microphones.
# The sound card here is registered without the DisplayPort dai-links (fz-dtb-fixup.py --sound-nodp), so only
# playback PCM 1 (MultiMedia2 -> WSA) and capture PCM 3 (MultiMedia4 <- VA DMIC) exist.

SectionUseCase."HiFi" {
	File "/Qualcomm/x1e80100/Ideapad-3-HiFi.conf"
	Comment "HiFi quality Music."
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wsa-init.File "/codecs/wsa884x/two-speakers/init.conf"
Include.wsam-init.File "/codecs/qcom-lpass/wsa-macro/init.conf"
