# Verified software-rendering environment for bounded simpledrm diagnostic.
# Provenance (read-only rootfs inventory, no invented flags):
# - Mesa 1:26.2.4 provides kms_swrast_dri.so + swrast_dri.so (software DRM path).
# - LIBGL_ALWAYS_SOFTWARE present in libGLX_mesa.so* + libgallium strings.
# - GALLIUM_DRIVER + llvmpipe present in libgallium-26.2.4 strings.
# - LP_NUM_THREADS present in libgallium strings (verified thread limiter).
# - KWIN_COMPOSE consumed by kwin_wayland + libkwin (error strings:
#   "Could not fulfill the requested compositing mode in KWIN_COMPOSE:",
#   "Unknown KWIN_COMPOSE mode set, ignoring"); QPainter backend symbols
#   present in libkwin.so.6.7.5 (createQPainterBackend,
#   attemptQPainterCompositing, QPainterBackend, isSoftwareRenderer).
#   First candidate KWIN_COMPOSE=Q requests QPainter compositing; unknown
#   values are ignored fail-safe by KWin, no retry loop is implemented.
# - KWIN_DRM_* present ONLY in libkwin.so, NOT in kwin_wayland executable:
#   no KWIN_DRM_* is set here (do not invent DRM flags).
# - EGL present via libEGL_mesa; Qt Wayland via qt6-base 6.11.2 libqwayland.so
#   (no qt6-wayland package needed); xsessions empty (no X11 Plasma promise).
# - KWin logind linkage via libsystemd only (no libseat); live UID 1000 is
#   wheel-only, so DRM ACLs come from PAM/logind, no group edits.
# Conservative limits: 2 software threads, no GPU/MDSS enablement.
LIBGL_ALWAYS_SOFTWARE=1
GALLIUM_DRIVER=llvmpipe
LP_NUM_THREADS=2
KWIN_COMPOSE=Q
