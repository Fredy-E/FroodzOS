set timeout=30
set default=0
terminal_output console
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

echo 'FroodzOS - Lenovo native tests (dt25b)'
echo 'FroodzOS entries are text-only: USB logs ON, firmware capture OFF.'
set platform_cmdline='clk_ignore_unused pd_ignore_unused efi-pstore.pstore_disable=1'
smbios --type 4 --get-string 5 --set proc_version
if regexp 'Snapdragon.*' "$proc_version"; then
    echo 'Snapdragon detected: applying Ubuntu reference boot workarounds.'
    if [ "$lockdown" != 'y' ]; then
        cutmem 0x8800000000 0x8fffffffff
        echo 'Excluded firmware memory range 0x8800000000-0x8fffffffff.'
    else
        echo 'Memory workaround unavailable: GRUB is in lockdown mode.'
    fi
    set platform_cmdline="$platform_cmdline arm64.nopauth"
fi

menuentry 'FroodzOS dt25b - Text + CPU temperature logging (default)' {
    set gfxpayload=keep
    echo 'Current native-tested image: systemd text console, no graphical login.'
    echo 'At KESTREL-TEXT# run kestrel-proof; wait for KESTREL_PROOF_SAVED.'
    echo 'Then allow 90 seconds for background logs; use poweroff normally.'
    echo 'CPU temperatures are saved to USB Logs, not printed by kestrel-proof.'
    linux /EFI/Linux/kestrel-live.efi kestrel_log=1 rd.log=console rd.log=file archisobasedir=arch archisolabel=KESTREL_A64 copytoram=n cow_spacesize=512M $platform_cmdline console=tty1 loglevel=4 panic=0 module_blacklist=dispcc_x1e80100 kestrel_textboot=1 kestrel_console=tty1 kestrel_graphics=0 systemd.unit=multi-user.target systemd.show_status=1
    boot
}
menuentry 'FroodzOS dt24 - Text recovery (previous image)' {
    set gfxpayload=keep
    echo 'Loading the separately preserved dt24 native-tested text image.'
    echo 'Recovery only: CPU temperature sensors are unavailable on dt24.'
    echo 'USB logs ON, firmware capture OFF; use poweroff normally.'
    linux /EFI/Linux/kestrel-live-dt24.efi kestrel_log=1 rd.log=console rd.log=file archisobasedir=arch archisolabel=KESTREL_A64 copytoram=n cow_spacesize=512M $platform_cmdline console=tty1 loglevel=4 panic=0 module_blacklist=dispcc_x1e80100 kestrel_textboot=1 kestrel_console=tty1 kestrel_graphics=0 systemd.unit=multi-user.target systemd.show_status=1
    boot
}
menuentry 'Ubuntu Concept - control boot (Try Ubuntu only)' {
    set gfxpayload=keep
    echo 'Loading the downloaded Ubuntu Concept control image...'
    echo 'Passing the Slim 3 device tree; DT machines need one.'
    devicetree /boot/slim3-x126100.dtb
    linux /casper/vmlinuz $platform_cmdline --- console=tty0 loglevel=7 panic=0
    initrd /casper/initrd
    boot
}
menuentry 'Return to firmware boot menu' {
    exit
}

