name: privacy
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Added lines (pull request) or whole tree report (other events)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python -B tools/check-privacy.py --base "origin/${{ github.base_ref }}"
          else
            python -B tools/check-privacy.py --all
          fi
