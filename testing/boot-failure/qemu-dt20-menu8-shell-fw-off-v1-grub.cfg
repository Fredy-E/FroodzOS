set timeout=1
set default=7
terminal_output console
echo KESTREL_EFI_MENU_REACHED
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

echo 'Kestrel diagnostic loader dt20 - GRUB reached'
echo 'Automatic panic reboot is disabled in the Kestrel entries.'
set platform_cmdline='clk_ignore_unused pd_ignore_unused efi-pstore.pstore_disable=1'
smbios --type 4 --get-string 5 --set proc_version
if regexp 'Snapdragon.*' "$proc_version"; then
    echo 'Snapdragon detected: applying Ubuntu reference boot workarounds.'
    if [ "$lockdown" != 'y' ]; then
        cutmem 0x8800000000 0x8fffffffff
        echo 'Excluded firmware memory range 0x8800000000-0x8fffffffff.'
    else
        echo 'Memory workaround unavailable: GRUB is in lockdown mode.'
    fi
    set platform_cmdline="$platform_cmdline arm64.nopauth"
fi

menuentry 'Kestrel v2 - live desktop (diagnostic messages)' {
    set gfxpayload=keep
    echo 'Loading corrected Kestrel UKI and local board firmware...'
    echo KESTREL_GRUB_LOADING_LOG_UKI
    linux /EFI/Linux/kestrel-live.efi kestrel_log=1 debug archisobasedir=arch archisolabel=KESTREL_A64 copytoram=n cow_spacesize=512M $platform_cmdline console=ttyAMA0,115200 loglevel=7 ignore_loglevel panic=0
    echo 'Handing control to the Linux kernel.'
    boot
}
menuentry 'Ubuntu Concept - control boot (Try Ubuntu only)' {
    set gfxpayload=keep
    echo 'Loading the downloaded Ubuntu Concept control image...'
    echo 'Passing the Slim 3 device tree; DT machines need one.'
    devicetree /boot/slim3-x126100.dtb
    linux /casper/vmlinuz $platform_cmdline --- console=ttyAMA0,115200 loglevel=7 panic=0
    initrd /casper/initrd
    boot
}
menuentry 'Kestrel v2 - text-only diagnostic boot' {
    set gfxpayload=keep
    echo 'Loading Kestrel without the graphical login manager...'
    echo KESTREL_GRUB_LOADING_LOG_UKI
    linux /EFI/Linux/kestrel-live.efi kestrel_log=1 debug archisobasedir=arch archisolabel=KESTREL_A64 copytoram=n cow_spacesize=512M $platform_cmdline console=ttyAMA0,115200 loglevel=7 ignore_loglevel panic=0 systemd.unit=multi-user.target
    boot
}
menuentry 'Kestrel v2 + USB LOG CAPTURE - live desktop (run this on crash tests)' {
    set gfxpayload=keep
    echo 'RAM capture starts early; USB Logs are saved only if the USB becomes usable.'
    echo KESTREL_GRUB_LOADING_LOG_UKI
    linux /EFI/Linux/kestrel-live.efi kestrel_log=1 rd.log=file debug archisobasedir=arch archisolabel=KESTREL_A64 copytoram=n cow_spacesize=512M $platform_cmdline console=ttyAMA0,115200 loglevel=7 ignore_loglevel panic=0
    echo 'Handing control to the Linux kernel.'
    boot
}
menuentry 'Kestrel v2 + USB LOG CAPTURE - text-only (logging, no graphical login)' {
    set gfxpayload=keep
    echo 'RAM capture starts early; USB Logs are saved only if the USB becomes usable.'
    echo KESTREL_GRUB_LOADING_LOG_UKI
    linux /EFI/Linux/kestrel-live.efi kestrel_log=1 rd.log=file debug archisobasedir=arch archisolabel=KESTREL_A64 copytoram=n cow_spacesize=512M $platform_cmdline console=ttyAMA0,115200 loglevel=7 ignore_loglevel panic=0 systemd.unit=multi-user.target
    boot
}
menuentry 'Kestrel v2 - initcall debug (photo the LAST line)' {
    set gfxpayload=keep
    echo 'Each driver init line will print; photo the last visible line.'
    echo KESTREL_GRUB_LOADING_LOG_UKI
    linux /EFI/Linux/kestrel-live.efi kestrel_log=1 debug archisobasedir=arch archisolabel=KESTREL_A64 copytoram=n cow_spacesize=512M $platform_cmdline console=ttyAMA0,115200 loglevel=7 ignore_loglevel panic=0 initcall_debug
    echo 'Handing control to the Linux kernel.'
    boot
}
menuentry 'Kestrel v2 - NO iommu (SMMU suspect)' {
    set gfxpayload=keep
    echo 'Skips IOMMU drivers; photo how far it gets.'
    echo KESTREL_GRUB_LOADING_LOG_UKI
    linux /EFI/Linux/kestrel-live.efi kestrel_log=1 debug archisobasedir=arch archisolabel=KESTREL_A64 copytoram=n cow_spacesize=512M $platform_cmdline console=ttyAMA0,115200 loglevel=7 ignore_loglevel panic=0 initcall_debug initcall_blacklist=arm_smmu_init,qcom_smmu_module_init
    echo 'Handing control to the Linux kernel.'
    boot
}
menuentry 'Kestrel dt20 - USB dependencies + LIVE ROOT SHELL (default)' {
    set gfxpayload=keep
    echo 'Target: USB-backed live root Bash, not an initramfs emergency shell.'
    echo 'No graphical login. Do not exit PID 1; use systemctl poweroff --force --force.'
    echo 'Firmware capture v2: delayed USB errors + late timeout, max FOUR records.'
    echo 'Wait for KESTREL_FW_SAVED slot=3 (up to ~75 seconds). Existing records DISARM capture.'
    echo KESTREL_GRUB_LOADING_LOG_UKI
    linux /EFI/Linux/kestrel-live.efi kestrel_log=1  rd.log=console rd.log=file debug archisobasedir=arch archisolabel=KESTREL_A64 copytoram=n cow_spacesize=512M $platform_cmdline console=ttyAMA0,115200 loglevel=7 ignore_loglevel panic=0 initcall_debug module_blacklist=dispcc_x1e80100 init=/usr/bin/bash
    echo 'Handing control to the Linux kernel.'
    boot
}
menuentry 'Kestrel dt20 - LIVE ROOT SHELL + FW LOG v2 (confirm)' {
    set gfxpayload=keep
    echo 'Target: USB-backed live root Bash, not an initramfs emergency shell.'
    echo 'No graphical login. Do not exit PID 1; use systemctl poweroff --force --force.'
    echo 'OPTIONAL: writes at most FOUR small UEFI firmware records; no updates or deletion.'
    echo 'Existing records disarm new writes. Tested in QEMU, NOT proven safe on Lenovo.'
    echo 'Type YES and press Enter to opt in. Anything else returns to the menu.'
    set fwconfirm=''
    read fwconfirm
    if [ "$fwconfirm" = 'YES' ]; then
        echo KESTREL_GRUB_LOADING_LOG_UKI
        linux /EFI/Linux/kestrel-live.efi kestrel_log=1  rd.log=console rd.log=file debug archisobasedir=arch archisolabel=KESTREL_A64 copytoram=n cow_spacesize=512M $platform_cmdline console=ttyAMA0,115200 loglevel=7 ignore_loglevel panic=0 initcall_debug module_blacklist=dispcc_x1e80100 init=/usr/bin/bash
        boot
    else
        echo 'Firmware checkpoints cancelled; no kernel was started.'
        sleep 3
    fi
}
menuentry 'Kestrel v2 - slow print (EXPERIMENTAL, may remain at logo)' {
    set gfxpayload=keep
    echo 'Artificial printk delay changes timing; the final line is NOT proof of the cause.'
    echo KESTREL_GRUB_LOADING_LOG_UKI
    linux /EFI/Linux/kestrel-live.efi kestrel_log=1 debug archisobasedir=arch archisolabel=KESTREL_A64 copytoram=n cow_spacesize=512M $platform_cmdline console=ttyAMA0,115200 loglevel=7 ignore_loglevel panic=0 initcall_debug boot_delay=1000
    echo 'Handing control to the Linux kernel.'
    boot
}
menuentry 'Return to firmware boot menu' {
    exit
}
