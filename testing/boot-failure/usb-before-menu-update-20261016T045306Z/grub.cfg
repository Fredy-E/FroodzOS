set timeout=30
set default=0
terminal_output console
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

echo 'Kestrel diagnostic loader v2 - GRUB reached'
echo 'Automatic panic reboot is disabled in the Kestrel entries.'
set platform_cmdline='clk_ignore_unused pd_ignore_unused'
smbios --type 4 --get-string 5 --set proc_version
if regexp 'Snapdragon.*' "$proc_version"; then
    echo 'Snapdragon detected: applying Ubuntu reference boot workarounds.'
    if [ "$lockdown" != 'y' ]; then
        cutmem 0x8800000000 0x8fffffffff
        echo 'Excluded firmware memory range 0x8800000000-0x8fffffffff.'
    else
        echo 'Memory workaround unavailable: GRUB is in lockdown mode.'
    fi
    set platform_cmdline="$platform_cmdline arm64.nopauth"
fi

menuentry 'Kestrel v2 - live desktop (diagnostic messages)' {
    set gfxpayload=keep
    echo 'Loading corrected Kestrel UKI and local board firmware...'
    linux /EFI/Linux/kestrel-live.efi debug archisobasedir=arch archisolabel=KESTREL_A64 copytoram=n cow_spacesize=512M $platform_cmdline console=tty0 loglevel=7 ignore_loglevel panic=0
    echo 'Handing control to the Linux kernel.'
    boot
}
menuentry 'Ubuntu Concept - control boot (Try Ubuntu only)' {
    set gfxpayload=keep
    echo 'Loading the downloaded Ubuntu Concept control image...'
    echo 'Passing the Slim 3 device tree; DT machines need one.'
    devicetree /boot/slim3-x126100.dtb
    linux /casper/vmlinuz $platform_cmdline --- console=tty0 loglevel=7 panic=0
    initrd /casper/initrd
    boot
}
menuentry 'Kestrel v2 - text-only diagnostic boot' {
    set gfxpayload=keep
    echo 'Loading Kestrel without the graphical login manager...'
    linux /EFI/Linux/kestrel-live.efi debug archisobasedir=arch archisolabel=KESTREL_A64 copytoram=n cow_spacesize=512M $platform_cmdline console=tty0 loglevel=7 ignore_loglevel panic=0 systemd.unit=multi-user.target
    boot
}
menuentry 'Kestrel v2 + USB LOG CAPTURE - live desktop (run this on crash tests)' {
    set gfxpayload=keep
    echo 'Kernel log will be written to the USB Logs directory before the crash.'
    linux /EFI/Linux/kestrel-live-log.efi kestrel_log=1 rd.log=file debug archisobasedir=arch archisolabel=KESTREL_A64 copytoram=n cow_spacesize=512M $platform_cmdline console=tty0 loglevel=7 ignore_loglevel panic=0
    echo 'Handing control to the Linux kernel.'
    boot
}
menuentry 'Kestrel v2 + USB LOG CAPTURE - text-only (logging, no graphical login)' {
    set gfxpayload=keep
    echo 'Kernel log will be written to the USB Logs directory before the crash.'
    linux /EFI/Linux/kestrel-live-log.efi kestrel_log=1 rd.log=file debug archisobasedir=arch archisolabel=KESTREL_A64 copytoram=n cow_spacesize=512M $platform_cmdline console=tty0 loglevel=7 ignore_loglevel panic=0 systemd.unit=multi-user.target
    boot
}
menuentry 'Kestrel v2 - initcall debug (photo the LAST line at reset)' {
    set gfxpayload=keep
    echo 'Each driver init line will print; photo the last visible line.'
    linux /EFI/Linux/kestrel-live.efi debug archisobasedir=arch archisolabel=KESTREL_A64 copytoram=n cow_spacesize=512M $platform_cmdline console=tty0 loglevel=7 ignore_loglevel panic=0 initcall_debug
    echo 'Handing control to the Linux kernel.'
    boot
}
menuentry 'Kestrel v2 - NO interconnect driver (qnoc blacklist test)' {
    set gfxpayload=keep
    echo 'Skips all qnoc probing; photo how far it gets.'
    linux /EFI/Linux/kestrel-live.efi debug archisobasedir=arch archisolabel=KESTREL_A64 copytoram=n cow_spacesize=512M $platform_cmdline console=tty0 loglevel=7 ignore_loglevel panic=0 initcall_debug initcall_blacklist=qnoc_driver_init
    echo 'Handing control to the Linux kernel.'
    boot
}
menuentry 'Kestrel v2 - NO ufs phy (ufsphy blacklist test)' {
    set gfxpayload=keep
    echo 'Skips UFS PHY drivers; photo how far it gets.'
    linux /EFI/Linux/kestrel-live.efi debug archisobasedir=arch archisolabel=KESTREL_A64 copytoram=n cow_spacesize=512M $platform_cmdline console=tty0 loglevel=7 ignore_loglevel panic=0 initcall_debug initcall_blacklist=qmp_ufs_driver_init,qmp_ufs_phy_init
    echo 'Handing control to the Linux kernel.'
    boot
}
menuentry 'Kestrel v2 - NO cpuidle (idle-collapse test)' {
    set gfxpayload=keep
    echo 'Disables CPU idle states; photo how far it gets.'
    linux /EFI/Linux/kestrel-live.efi debug archisobasedir=arch archisolabel=KESTREL_A64 copytoram=n cow_spacesize=512M $platform_cmdline console=tty0 loglevel=7 ignore_loglevel panic=0 initcall_debug cpuidle.off=1
    echo 'Handing control to the Linux kernel.'
    boot
}
menuentry 'Return to firmware boot menu' {
    exit
}
