    echo KESTREL_GRUB_LOADING_LOG_UKI
    linux /EFI/Linux/kestrel-live-log.efi kestrel_log=1 rd.log=file debug archisobasedir=arch archisolabel=KESTREL_A64 copytoram=n cow_spacesize=512M $platform_cmdline console=ttyAMA0,115200 loglevel=7 ignore_loglevel panic=0
    echo 'Handing control to the Linux kernel.'
