set timeout=1
set default=0
terminal_output console
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

echo KESTREL_EFI_MENU_REACHED
echo 'Automatic panic reboot is disabled in the Kestrel entries.'
set platform_cmdline='clk_ignore_unused pd_ignore_unused'
smbios --type 4 --get-string 5 --set proc_version
if regexp 'Snapdragon.*' "$proc_version"; then
    echo 'Snapdragon detected: applying Ubuntu reference boot workarounds.'
    if [ "$lockdown" != 'y' ]; then
        cutmem 0x8800000000 0x8fffffffff
        echo 'Excluded firmware memory range 0x8800000000-0x8fffffffff.'
    else
        echo 'Memory workaround unavailable: GRUB is in lockdown mode.'
    fi
    set platform_cmdline="$platform_cmdline arm64.nopauth"
fi

menuentry 'Kestrel v2 - live desktop (diagnostic messages)' {
    set gfxpayload=keep
    echo KESTREL_GRUB_LOADING_V2_UKI
    linux /EFI/Linux/kestrel-live.efi debug archisobasedir=arch archisolabel=KESTREL_A64 copytoram=n cow_spacesize=512M $platform_cmdline console=ttyAMA0,115200 loglevel=7 ignore_loglevel panic=0 init=/usr/bin/bash
    echo 'Handing control to the Linux kernel.'
    boot
}
menuentry 'Ubuntu Concept - control boot (Try Ubuntu only)' {
    set gfxpayload=keep
    echo 'Loading the downloaded Ubuntu Concept control image...'
    linux /casper/vmlinuz $platform_cmdline --- console=ttyAMA0,115200 loglevel=7 panic=0 init=/usr/bin/bash
    initrd /casper/initrd
    boot
}
menuentry 'Kestrel v2 - text-only diagnostic boot' {
    set gfxpayload=keep
    echo KESTREL_GRUB_LOADING_V2_UKI
    linux /EFI/Linux/kestrel-live.efi debug archisobasedir=arch archisolabel=KESTREL_A64 copytoram=n cow_spacesize=512M $platform_cmdline console=ttyAMA0,115200 loglevel=7 ignore_loglevel panic=0 init=/usr/bin/bash systemd.unit=multi-user.target
    boot
}
menuentry 'Return to firmware boot menu' {
    exit
}
